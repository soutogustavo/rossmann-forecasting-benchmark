[project]
name = "rossmann-forecasting-benchmark"
version = "0.1.0"
description = "Rossmann Store Forecasting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.9",
    "mlflow>=2.22.4",
    "pandas>=2.0.0,<3.0.0",
    "prophet>=1.3.0",
    "setuptools>=65.0.0,<82.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[tool.pyright]
extraPaths = ["."]
